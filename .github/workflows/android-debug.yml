name: Build ORBIT Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Unpack uploaded project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q ORBIT-Android-Project.zip -d extracted
          wrapper="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$wrapper" ]; then
            echo "::error::No Gradle wrapper (gradlew) found inside the project archive."
            echo "Please upload the Android Studio project files directly or include gradlew."
            exit 1
          fi
          project_dir="$(dirname "$wrapper")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          chmod +x "$wrapper"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ORBIT-debug-apk
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
